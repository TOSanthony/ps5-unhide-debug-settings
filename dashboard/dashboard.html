<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord PS5</title>
<style>
:root{--card:rgba(16,19,28,.88);--line:rgba(255,255,255,.08);--txt:#eef1f7;--mut:#9aa3b5;--acc:#3b82f6;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;
background:radial-gradient(1200px 700px at 20% -10%,#4a2b12 0%,transparent 60%),radial-gradient(900px 600px at 100% 0%,#7a3b10 0%,transparent 55%),#0b0d14}
header{display:flex;align-items:baseline;justify-content:space-between;padding:22px 28px 6px}
#clock{font-size:clamp(28px,6vw,44px);font-weight:600;letter-spacing:1px}
#date{color:var(--mut);margin-left:14px;font-size:15px;text-transform:capitalize}
#gear{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);width:40px;height:40px;
border-radius:12px;font-size:18px;cursor:pointer;flex:none}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;
padding:14px clamp(14px,4vw,28px) 40px;max-width:1600px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-height:130px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--mut);letter-spacing:.4px}
.wide{grid-column:span 2}
.big{font-size:34px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--acc)}
.pill{padding:2px 10px;border-radius:99px;font-size:13px;border:1px solid var(--line)}
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.18);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}.sw:disabled{opacity:.4}
.on{color:var(--ok)}.off{color:var(--bad)}
a.link{display:block;margin:6px 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--txt);text-decoration:none}
a.link:hover{background:rgba(59,130,246,.35)}
small{color:var(--mut)}
#whlog{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;background:rgba(0,0,0,.35);
border-radius:10px;padding:10px;margin-top:10px;font:12px/1.4 ui-monospace,Consolas,monospace}
button.mini{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:8px;
padding:6px 12px;font-size:13px;cursor:pointer}
button.mini:hover{background:rgba(59,130,246,.3)}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
#backdrop.open{display:block}
#settings{position:fixed;top:0;right:0;height:100%;width:min(360px,92vw);background:#11141f;
border-left:1px solid var(--line);z-index:11;transform:translateX(100%);transition:.2s;
padding:18px;overflow:auto}
#settings.open{transform:translateX(0)}
#settings h1{font-size:18px;margin:0 0 14px}
#closeSettings{float:right;background:0;border:0;color:var(--txt);font-size:20px;cursor:pointer}
@media(max-width:560px){main{grid-template-columns:1fr}.wide{grid-column:auto}header{padding:16px 16px 4px}}
@media(min-width:1400px){main{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div><span id="clock">--:--</span><span id="date"></span></div><button id="gear" onclick="openSettings()" title="Réglages">⚙</button></header>
<main>
 <section class="card"><h2>STOCKAGE DE LA CONSOLE</h2><div id="storage">...</div></section>
 <section class="card"><h2>MÉTÉO</h2><div id="weather"><small>Chargement…</small></div></section>
 <section class="card wide"><h2>RACCOURCIS</h2><div id="links"></div></section>
</main>
<div id="backdrop" onclick="closeSettings()"></div>
<aside id="settings">
 <button id="closeSettings" onclick="closeSettings()">✕</button>
 <h1>Réglages</h1>
 <section class="card"><h2>ACCUEIL PS5</h2><div id="tiles">...</div></section>
 <section class="card" style="margin-top:14px"><h2>ORBIT STORE</h2><div id="orbit">...</div></section>
 <section class="card" style="margin-top:14px"><h2>DIAGNOSTIC</h2><div id="diag">...</div></section>
</aside>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H={'X-Menu':'1'};
let note='';
function openSettings(){$('backdrop').classList.add('open');$('settings').classList.add('open')}
function closeSettings(){$('backdrop').classList.remove('open');$('settings').classList.remove('open')}
async function act(url){try{const r=await fetch(url,{method:'POST',headers:H});if(!r.ok)throw 0;note='Redémarre la PS5 pour appliquer.'}catch(e){note='Échec (sauvegarde ou base inaccessible).'}await load()}
const setTile=(id,v)=>act('/api/set?id='+id+'&v='+(v?1:0));
const setOrbit=v=>act('/api/orbit?v='+(v?1:0));
const setWhInspector=v=>act('/api/wh_inspector?v='+(v?1:0));
let whlogOpen=false,whlogText='';
async function viewLog(){whlogOpen=true;$('whlogbox').style.display='block';$('whlog').textContent='Chargement…';
 try{const r=await fetch('/api/wh_inspector_log',{headers:H});const j=await r.json();
  whlogText=j.log||'(journal vide — ouvre le Welcome Hub sur la console puis réessaie)'}
 catch(e){whlogText='Échec de la lecture du journal.'}
 $('whlog').textContent=whlogText}
const gb=b=>(b/1073741824).toFixed(1)+' Go';
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 $('date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
setInterval(tick,1000);tick();
const WX={0:'Ciel dégagé',1:'Plutôt dégagé',2:'Partiellement nuageux',3:'Couvert',45:'Brouillard',48:'Brouillard givrant',51:'Bruine',53:'Bruine',55:'Bruine',61:'Pluie faible',63:'Pluie',65:'Forte pluie',71:'Neige faible',73:'Neige',75:'Forte neige',80:'Averses',81:'Averses',82:'Fortes averses',95:'Orage'};
async function weather(w){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto');
 const j=await r.json();$('weather').innerHTML='<div class="big">'+Math.round(j.current.temperature_2m)+'°C</div><div>'+(WX[j.current.weather_code]||'—')+'</div><small>'+esc(w.city)+' · min '+Math.round(j.daily.temperature_2m_min[0])+'° / max '+Math.round(j.daily.temperature_2m_max[0])+'°</small>'}
 catch(e){$('weather').innerHTML='<small>Météo indisponible (pas d\'accès internet depuis cet appareil)</small>'}}
let wxDone=false;
async function load(){try{const r=await fetch('/api/info',{cache:'no-store'});const j=await r.json();
 if(j.storage.total>0){const used=j.storage.total-j.storage.free;$('storage').innerHTML='<div class="row"><span>Espace libre</span><b>'+gb(j.storage.free)+'</b></div><div class="bar"><i style="width:'+Math.round(used*100/j.storage.total)+'%"></i></div><small>'+gb(used)+' utilisés sur '+gb(j.storage.total)+'</small>'}
 else $('storage').innerHTML='<small>Indisponible</small>';
 $('tiles').innerHTML=j.tiles.map(t=>'<div class="row"><span>'+esc(t.label)+'</span><button class="sw '+(t.visible?'on':'')+'" '+(t.found?'':'disabled ')+'title="'+(t.visible?'visible':'masqué')+'" onclick="setTile(\''+esc(t.id)+'\','+(t.visible?0:1)+')"></button></div>').join('')+'<small>'+note+'</small>';
 $('links').innerHTML=j.links.map(l=>'<a class="link" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+'</a>').join('')||'<small>Aucun raccourci. Cree /data/dashboard_links.txt (une ligne par lien : Nom|http://...).</small>';
 const o=j.orbit;$('orbit').innerHTML=o.found?'<div class="row"><span>Épinglé à gauche</span><button class="sw '+(o.pinned?'on':'')+'" onclick="setOrbit('+(o.pinned?0:1)+')"></button></div><small>Verrou maintenu automatiquement tant que dashboard.elf tourne.</small>':'<small>Non installé</small>';
 $('diag').innerHTML='<div class="row"><span>Widget Hub Inspector</span><button class="sw '+(j.wh_inspector?'on':'')+'" onclick="setWhInspector('+(j.wh_inspector?0:1)+')"></button></div><small>Déploie un widget de diagnostic dans le Welcome Hub (liste les NativeModules disponibles).</small><div class="row" style="margin-top:10px"><button class="mini" onclick="viewLog()">Voir le journal</button></div><div id="whlogbox" style="display:'+(whlogOpen?'block':'none')+'"><div id="whlog">'+esc(whlogText)+'</div></div>';
 if(!wxDone){wxDone=true;weather(j.weather)}
}catch(e){}}
load();setInterval(load,10000);
</script></body></html>
